# ==============================================================================
# AIO Calculator — Nginx Production Server Configuration Block
# Optimized for CloudPages (Nginx mode), VPS, Docker, or Dedicated Servers
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name aio-calculator.com www.aio-calculator.com;

    # Root directory pointing to the deployed dist contents
    root /var/www/aio-calculator;
    index index.html;

    # Character set
    charset utf-8;

    # --------------------------------------------------------------------------
    # Security Headers
    # --------------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; media-src 'self' https:; font-src 'self' data: https:;" always;

    # --------------------------------------------------------------------------
    # Single Allowed 301 Redirect:
    # Old legacy dice post URL to canonical interactive 1-to-100 dice roller tool
    # --------------------------------------------------------------------------
    location = /free-online-dice-roller {
        return 301 /free-online-dice-roller-1-to-100/;
    }
    location = /free-online-dice-roller/ {
        return 301 /free-online-dice-roller-1-to-100/;
    }

    # --------------------------------------------------------------------------
    # HTML Caching (1 hour revalidation) & Standard Directory-Index Routing
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "max-age=3600, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # --------------------------------------------------------------------------
    # Modular JS, CSS & Static Assets Caching (1 year immutable)
    # --------------------------------------------------------------------------
    location ~* \.(?:css|js|webp|svg|jpg|jpeg|png|gif|ico|mp4|webm|woff2|woff|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Data files (JSON search index, XML sitemaps, robots.txt, llms.txt)
    location ~* \.(?:json|xml|txt)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        access_log off;
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # Gzip Compression
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
    location = /robots.txt {
        log_not_found off;
        access_log off;
    }
}
